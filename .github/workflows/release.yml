name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Fork (Yis-company): releases publish @yis-company/ksef-client-ts to public
# npmjs.org (primary, NPM_TOKEN secret) and to GitHub Packages (mirror).
# id-token: write lets npm sign provenance for the npmjs.org publish.
permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="release_notes.md"
          CHANGELOG="packages/ksef-client-ts/CHANGELOG.md"

          if [[ ! -f "$CHANGELOG" ]]; then
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {in_section=1; next}
            in_section && $0 ~ "^## \\[" {exit}
            in_section {print}
          ' "$CHANGELOG" > "$NOTES_FILE"

          if [[ -s "$NOTES_FILE" ]] && [[ -n "$(tr -d '[:space:]' < "$NOTES_FILE")" ]]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HAS_NOTES: ${{ steps.changelog.outputs.has_notes }}
        run: |
          if gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            echo "Release $GITHUB_REF_NAME already exists, skipping"
            exit 0
          fi
          if [[ "$HAS_NOTES" == "true" ]]; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release_notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi

  publish-ghpkg:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@yis-company"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/ksef-client-ts/package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate build
        # Build first: every guard below reads the built dist. Keep this list in
        # sync with the guards in ci.yml: a tag can point at a commit that never
        # went through PR CI, so this is the only gate the published artifact hits.
        run: |
          bun run build
          bun run lint
          bun run check:node-types
          bun run check:pdf-types
          node packages/ksef-client-ts/scripts/check-pdf-cold.mjs
          bun run check:attw
          bun run check:publint
          bun run test

      - name: Prepare scoped package name
        working-directory: packages/ksef-client-ts
        run: |
          npm pkg set name="@yis-company/ksef-client-ts"
          npm pkg set repository.url="git+https://github.com/Yis-company/ksef-client-ts.git"

      - name: Publish
        working-directory: packages/ksef-client-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@yis-company/ksef-client-ts@$VERSION" version --registry https://npm.pkg.github.com 2>/dev/null; then
            echo "Version $VERSION already published to GitHub Packages, skipping"
            exit 0
          fi
          # Explicit dist-tag: prerelease versions such as 0.13.1-yis.1 must name one.
          npm publish --registry https://npm.pkg.github.com --tag latest

  publish-npm:
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # npm 11 (Node 24) for --provenance on a scoped public package.
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@yis-company"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/ksef-client-ts/package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate build
        # Build first: every guard below reads the built dist. Keep this list in
        # sync with the guards in ci.yml: a tag can point at a commit that never
        # went through PR CI, so this is the only gate the published artifact hits.
        run: |
          bun run build
          bun run lint
          bun run check:node-types
          bun run check:pdf-types
          node packages/ksef-client-ts/scripts/check-pdf-cold.mjs
          bun run check:attw
          bun run check:publint
          bun run test

      - name: Prepare scoped package name
        working-directory: packages/ksef-client-ts
        run: |
          npm pkg set name="@yis-company/ksef-client-ts"
          npm pkg set repository.url="git+https://github.com/Yis-company/ksef-client-ts.git"

      - name: Publish
        working-directory: packages/ksef-client-ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "@yis-company/ksef-client-ts@$VERSION" version --registry https://registry.npmjs.org 2>/dev/null; then
            echo "Version $VERSION already published to npmjs, skipping"
            exit 0
          fi
          # Explicit dist-tag: prerelease versions such as 0.13.1-yis.1 must name one.
          npm publish --registry https://registry.npmjs.org --access public --provenance --tag latest
